  <script>
    // Supabase may fall back to the configured Site URL when /admin is not allowlisted.
    // Preserve the one-time authentication response and hand it to the admin page.
    (function () {
      var h = new URLSearchParams(location.hash.slice(1));
      var q = new URLSearchParams(location.search);
      if ((h.has('access_token') && h.has('refresh_token')) || (q.has('code') && q.has('state'))) {
        location.replace('/admin' + location.search + location.hash);
      }
    }());
  </script>
